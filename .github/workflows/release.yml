# A release, made when a tag v* is pushed -- Actions minutes are free for a
# public repository -- or by hand for a tag pushed already, to make one again:
#
#   gh workflow run release.yml -f tag=v1.0.7
#
# The complete source; for Linux x86_64 and ARM64, on the CPU and with CUDA,
# and macOS with Metal, mxi alone as an archive and the platform's wheel --
# mxi, mxi-cuda for the CUDA builds -- with the Python and that mxi in one;
# each built from the tag and its tests run before anything is published;
# then a GitHub release with them, its text RELEASE_NOTES.md's
# section for the version (scripts/release_notes.py). A tag with -rc, -alpha
# or -beta makes a pre-release. docs/release.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, pushed already: v1.0.7, v1.0.7-rc1"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Apple's metal-cpp headers, which the Metal build needs. Not tried from the
  # sandbox this was written in: if the download fails, the current zip's name
  # is on https://developer.apple.com/metal/cpp/
  METAL_CPP_URL: https://developer.apple.com/metal/cpp/files/metal-cpp_macOS15_iOS18.zip

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0
      - name: The complete source, submodules and all
        run: scripts/source_archive.sh "$TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: source
          path: mxi-*-source.tar.gz

  linux:
    # Built in manylinux_2_28 -- AlmaLinux 8, glibc 2.28, with a recent GCC
    # toolset -- so that the program runs wherever glibc is 2.28 or later: RHEL
    # 8 and 9 and their clones, Ubuntu 20.04 on, Debian 11 on, Raspberry Pi OS.
    # Built on Ubuntu 22.04 it had asked for glibc 2.35, and RHEL 9's 2.34
    # would not run it (reported of 1.1.1); scripts/package_release.sh refuses
    # anything newer than 2.28. Four builds, each on its architecture's runner:
    # x86_64 and ARM64, for the CPU -- runs anywhere, no driver needed; on
    # ARM64 a Raspberry Pi 4 or 5 with a 64-bit OS, Graviton, Ampere, Grace --
    # and with CUDA 12.8 -- from NVIDIA's redistributable archives -- x86_64
    # Volta to Blackwell, ARM64 the server builds (sbsa) for Hopper and Blackwell, the GH200 and GB200, each carrying its
    # PTX. Not Jetson, whose toolkit is another.
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    # vcpkg uses the system's CMake and Ninja: on ARM Linux it has none of its
    # own to fetch.
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
    strategy:
      # Every build to its end, whatever another does: by default a failure
      # cancels the rest, and one download's failure had left the other three
      # untried (v1.1.2-rc1). Nothing is published unless all pass.
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64
            triplet: x64-linux-release
            cuda: "OFF"
          - platform: linux-x86_64-cuda
            runner: ubuntu-latest
            arch: x86_64
            triplet: x64-linux-release
            cuda: "ON"
            cuda_platform: linux-x86_64
            cuda_architectures: "70;75;80;86;89;90;100;120"
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
            triplet: arm64-linux-release
            cuda: "OFF"
          - platform: linux-arm64-cuda
            runner: ubuntu-24.04-arm
            arch: aarch64
            triplet: arm64-linux-release
            cuda: "ON"
            cuda_platform: linux-sbsa
            cuda_architectures: "90;100"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: Tools -- the image's Python, its CMake and Ninja; vcpkg's needs
        run: |
          py=/opt/python/cp312-cp312/bin
          "$py/python" -m pip install -q cmake ninja
          echo "$py" >> "$GITHUB_PATH"
          dnf install -y -q zip unzip tar perl-IPC-Cmd
          gcc --version | head -1
      # From NVIDIA's redistributable archives, each checked against its
      # SHA-256 (scripts/install_cuda.py), not the RHEL 8 package repository,
      # whose index named files it did not have -- for hours, through every
      # retry (v1.1.2-rc1 and rc2).
      - name: The CUDA toolkit (compiling needs no GPU)
        if: matrix.cuda == 'ON'
        run: |
          python scripts/install_cuda.py 12.8.1 ${{ matrix.cuda_platform }} /usr/local/cuda
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"
          echo "CUDACXX=/usr/local/cuda/bin/nvcc" >> "$GITHUB_ENV"
      # A static HDF5, zlib and FFTW, from vcpkg's manifest (vcpkg.json),
      # release builds only (the -release triplets), so that the program
      # needs nothing but the C library: libstdc++ and libgcc linked in too.
      - name: vcpkg, for a static HDF5
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          -DVCPKG_MANIFEST_FEATURES=fftw -DMXI_FFTW=ON
          -DMXI_CUDA=${{ matrix.cuda }} -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.cuda_architectures || '90' }}"
      - name: Build
        run: cmake --build build
      - name: "Test: the CPU paths, the runner having no GPU"
        # A hang fails in half an hour, not GitHub's six; and mxi ui's window
        # tests are not run here: on a runner whose display may never come,
        # a window can wait for ever (v1.1.4-rc1's macOS build stalled).
        # They run where there is a display (xvfb, a desktop).
        timeout-minutes: 30
        env:
          MXI_NO_WINDOW_TESTS: "1"
        run: |
          ctest --test-dir build --output-on-failure -E 'gpu|device'
          python -m pip install -q pytest numpy scipy msgpack gemmi h5py hdf5plugin matplotlib
          # Absolute: tests run the programs from temporary directories (the
          # suite makes them so as well, tests/conftest.py).
          cd python && MXI_FIND="$GITHUB_WORKSPACE/build/mxi_find" MXI_BUILD="$GITHUB_WORKSPACE/build" PYTHONPATH=src:tests python -m pytest -q tests
      - name: Package
        run: scripts/package_release.sh build "$TAG" "${{ matrix.platform }}"
      # The platform's wheel, mxi (mxi-cuda for a CUDA build): the Python and
      # this mxi in one (scripts/make_wheel.py) -- installed in a fresh
      # environment and run from it, not activated, so that a wheel whose mxi
      # does not run is not released.
      - name: The wheel -- mxi, with this platform's mxi in it
        run: |
          python -m pip install -q build
          python -m build --wheel --outdir purewheel python
          python scripts/make_wheel.py purewheel/*.whl build/mxi "${{ matrix.platform }}" dist "$TAG"
          python -m venv /tmp/try
          /tmp/try/bin/pip install -q --no-deps dist/*.whl
          /tmp/try/bin/mxi --version
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: |
            mxi-*-${{ matrix.platform }}.tar.gz
            dist/*.whl

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: The Metal compiler, and metal-cpp
        run: |
          # Recent Xcodes ship the Metal toolchain as a separate component.
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
          curl -fsSL -o metal-cpp.zip "$METAL_CPP_URL"
          unzip -q metal-cpp.zip -d "$RUNNER_TEMP"
          echo "METAL_CPP_DIR=$(dirname "$(find "$RUNNER_TEMP" -name Metal.hpp -path '*Metal/Metal.hpp' | head -1)")/.." >> "$GITHUB_ENV"
          brew install ninja
      - name: vcpkg, for a static HDF5
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      # For macOS 13 and later, mxi and its static libraries alike (an overlay
      # triplet, cmake/triplets); unset, both took the runner's macOS 15 as
      # their minimum. Any API newer than 13 used without a check is an
      # error, so that the binaries cannot fail on an older macOS at run time.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=arm64-osx-release
          -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/triplets"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_CXX_FLAGS="-Werror=unguarded-availability-new"
          -DVCPKG_MANIFEST_FEATURES=fftw -DMXI_FFTW=ON
          -DMXI_METAL=ON -DMETAL_CPP_DIR="$METAL_CPP_DIR"
      - name: Build
        run: cmake --build build
      # A Python of our choosing, as the Linux builds' containers give theirs
      # (3.12): the runner's own python3 had become 3.15, for which h5py and
      # gemmi had no wheels yet, and pip tried and failed to build them
      # (1.1.3-rc1).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Test: the CPU paths, a hosted runner's GPU not to be relied on"
        # A hang fails in half an hour, not GitHub's six; and mxi ui's window
        # tests are not run here: on a runner whose display may never come,
        # a window can wait for ever (v1.1.4-rc1's macOS build stalled).
        # They run where there is a display (xvfb, a desktop).
        timeout-minutes: 30
        env:
          MXI_NO_WINDOW_TESTS: "1"
        run: |
          ctest --test-dir build --output-on-failure -E 'gpu|device'
          python3 -m pip install -q pytest numpy scipy msgpack gemmi h5py hdf5plugin matplotlib
          # Absolute: tests run the programs from temporary directories (the
          # suite makes them so as well, tests/conftest.py).
          cd python && MXI_FIND="$GITHUB_WORKSPACE/build/mxi_find" MXI_BUILD="$GITHUB_WORKSPACE/build" PYTHONPATH=src:tests python3 -m pytest -q tests
      - name: Package
        run: scripts/package_release.sh build "$TAG" macos-arm64
      # The platform's wheel, mxi (mxi-cuda for a CUDA build): the Python and
      # this mxi in one (scripts/make_wheel.py) -- installed in a fresh
      # environment and run from it, not activated, so that a wheel whose mxi
      # does not run is not released.
      - name: The wheel -- mxi, with this platform's mxi in it
        run: |
          python3 -m pip install -q build
          python3 -m build --wheel --outdir purewheel python
          python3 scripts/make_wheel.py purewheel/*.whl build/mxi "macos-arm64" dist "$TAG"
          python3 -m venv /tmp/try
          /tmp/try/bin/pip install -q --no-deps dist/*.whl
          /tmp/try/bin/mxi --version
      - uses: actions/upload-artifact@v6
        with:
          name: macos-arm64
          path: |
            mxi-*-macos-arm64.tar.gz
            dist/*.whl

  release:
    needs: [source, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The files, wherever the artifacts put them: a platform's artifact
        # holds its archive and dist/ with its wheel, so merged they are
        # assets/*.tar.gz and assets/dist/*.whl -- and assets/* had given gh
        # the directory dist, which it cannot upload (v1.3.0-rc2). Counted
        # first: the source and five archives, five wheels -- nothing
        # published short of one (Windows, when it comes, one of each more).
        run: |
          tag="$TAG"
          files=$(find assets -type f \( -name '*.tar.gz' -o -name '*.whl' \) | sort)
          echo "$files"
          archives=$(echo "$files" | grep -c '\.tar\.gz$' || true)
          wheels=$(echo "$files" | grep -c '\.whl$' || true)
          if [ "$archives" -ne 6 ] || [ "$wheels" -ne 5 ]; then
            echo "expected 6 archives and 5 wheels; found $archives and $wheels" >&2
            exit 1
          fi
          python3 scripts/release_notes.py "$tag" > notes.md
          case "$tag" in *-rc*|*-alpha*|*-beta*) pre=--prerelease ;; *) pre= ;; esac
          # shellcheck disable=SC2086
          gh release create "$tag" --verify-tag --title "mxi ${tag#v}" --notes-file notes.md $pre $files
