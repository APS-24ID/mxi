# A release, made when a tag v* is pushed -- Actions minutes are free for a
# public repository -- or by hand for a tag pushed already, to make one again:
#
#   gh workflow run release.yml -f tag=v1.0.7
#
# The complete source, Linux x86_64 and ARM64 on the CPU and with CUDA, macOS
# with Metal, and
# mxeq's wheel, each built from the tag and its tests run before anything is
# published; then a GitHub release with them, its text RELEASE_NOTES.md's
# section for the version (scripts/release_notes.py). A tag with -rc, -alpha
# or -beta makes a pre-release. docs/release.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, pushed already: v1.0.7, v1.0.7-rc1"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Apple's metal-cpp headers, which the Metal build needs. Not tried from the
  # sandbox this was written in: if the download fails, the current zip's name
  # is on https://developer.apple.com/metal/cpp/
  METAL_CPP_URL: https://developer.apple.com/metal/cpp/files/metal-cpp_macOS15_iOS18.zip

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0
      - name: The complete source, submodules and all
        run: scripts/source_archive.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: mxi-*-source.tar.gz

  linux:
    # The oldest supported Ubuntu, so that the binaries run on most current
    # distributions (glibc is the one library they take from the system).
    # Four builds, each on its own architecture's runner: x86_64 and ARM64,
    # each for the CPU -- which runs anywhere, no CUDA driver needed; on ARM64
    # a Raspberry Pi 4 or 5 with a 64-bit OS, Graviton, Ampere, Grace -- and
    # with CUDA, for an NVIDIA GPU: on x86_64 Volta to Hopper, on ARM64 the
    # server toolkit (sbsa) for Hopper, the GH200, with its PTX for what comes
    # after. Not Jetson, whose toolkit is another.
    runs-on: ${{ matrix.runner }}
    # vcpkg uses the system's CMake and Ninja: on ARM Linux it has none of its
    # own to fetch, and the runners have both.
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            triplet: x64-linux-release
            cuda: "OFF"
          - platform: linux-x86_64-cuda
            runner: ubuntu-22.04
            triplet: x64-linux-release
            cuda: "ON"
            cuda_repo: x86_64
            cuda_architectures: "70;75;80;86;89;90"
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            triplet: arm64-linux-release
            cuda: "OFF"
          - platform: linux-arm64-cuda
            runner: ubuntu-22.04-arm
            triplet: arm64-linux-release
            cuda: "ON"
            cuda_repo: sbsa
            cuda_architectures: "90"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: Ninja
        run: sudo apt-get install -y -q ninja-build
      - name: The CUDA toolkit (compiling needs no GPU)
        if: matrix.cuda == 'ON'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/${{ matrix.cuda_repo }}/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-toolkit-12-6
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"
      # A static HDF5 and zlib, from vcpkg's manifest (vcpkg.json), release
      # builds only (the -release triplets), so that the programs need nothing
      # but the C library: libstdc++ and libgcc linked in too, for older
      # distributions -- RHEL among them -- than the build's.
      - name: vcpkg, for a static HDF5
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          -DVCPKG_MANIFEST_FEATURES=fftw -DMXI_FFTW=ON
          -DMXI_CUDA=${{ matrix.cuda }} -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.cuda_architectures || '90' }}"
      - name: Build
        run: cmake --build build
      - name: "Test: the CPU paths, the runner having no GPU"
        run: |
          ctest --test-dir build --output-on-failure -E 'gpu|device'
          python3 -m pip install -q pytest numpy scipy msgpack gemmi h5py hdf5plugin matplotlib
          # Absolute: tests run the programs from temporary directories (the
          # suite makes them so as well, tests/conftest.py).
          cd python && MXI_FIND="$GITHUB_WORKSPACE/build/mxi_find" MXI_BUILD="$GITHUB_WORKSPACE/build" PYTHONPATH=src:tests python3 -m pytest -q tests
      - name: Package
        run: scripts/package_release.sh build "$TAG" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: mxi-*-${{ matrix.platform }}.tar.gz

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: The Metal compiler, and metal-cpp
        run: |
          # Recent Xcodes ship the Metal toolchain as a separate component.
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
          curl -fsSL -o metal-cpp.zip "$METAL_CPP_URL"
          unzip -q metal-cpp.zip -d "$RUNNER_TEMP"
          echo "METAL_CPP_DIR=$(dirname "$(find "$RUNNER_TEMP" -name Metal.hpp -path '*Metal/Metal.hpp' | head -1)")/.." >> "$GITHUB_ENV"
          brew install ninja
      - name: vcpkg, for a static HDF5
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      # For macOS 13 and later, mxi and its static libraries alike (an overlay
      # triplet, cmake/triplets); unset, both took the runner's macOS 15 as
      # their minimum. Any API newer than 13 used without a check is an
      # error, so that the binaries cannot fail on an older macOS at run time.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=arm64-osx-release
          -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/triplets"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_CXX_FLAGS="-Werror=unguarded-availability-new"
          -DVCPKG_MANIFEST_FEATURES=fftw -DMXI_FFTW=ON
          -DMXI_METAL=ON -DMETAL_CPP_DIR="$METAL_CPP_DIR"
      - name: Build
        run: cmake --build build
      - name: "Test: the CPU paths, a hosted runner's GPU not to be relied on"
        run: |
          ctest --test-dir build --output-on-failure -E 'gpu|device'
          python3 -m pip install -q --break-system-packages pytest numpy scipy msgpack gemmi h5py hdf5plugin matplotlib
          # Absolute: tests run the programs from temporary directories (the
          # suite makes them so as well, tests/conftest.py).
          cd python && MXI_FIND="$GITHUB_WORKSPACE/build/mxi_find" MXI_BUILD="$GITHUB_WORKSPACE/build" PYTHONPATH=src:tests python3 -m pytest -q tests
      - name: Package
        run: scripts/package_release.sh build "$TAG" macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: mxi-*-macos-arm64.tar.gz

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: mxeq's wheel
        run: |
          python3 -m pip install -q build
          python3 -m build --wheel --outdir dist python
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    needs: [source, linux, macos, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          python3 scripts/release_notes.py "$tag" > notes.md
          case "$tag" in *-rc*|*-alpha*|*-beta*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$tag" --verify-tag --title "mxi ${tag#v}" --notes-file notes.md $pre assets/*
